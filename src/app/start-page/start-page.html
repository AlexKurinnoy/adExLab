<main>
  <div class="main-box">
    <h1 [innerHTML]="'START-PAGE.SLOGAN' | translate"></h1>
    <h2>
      {{ 'START-PAGE.SUB_SLOGAN' | translate }}
    </h2>
    <div class="innerBox">
      <a href="#">
        <div class="actionButton">
          {{ 'START-PAGE.CALL' | translate }} →
        </div>
      </a>
      <div class="separ"></div>
      <div class="playBox">
        <a href="#">
          <img src="img/play_ico.png" alt="play">
          <p>{{ 'START-PAGE.SEE' | translate }}</p>
        </a>
      </div>
    </div>
    <div class="boxWithIcons">
      <div class="iconBox">
        <div class="pic"></div>
        <div class="description">
          <h3>10+</h3>
          <p>{{ 'START-PAGE.YERS' | translate }}</p>
        </div>
      </div>
      <div class="iconBox">
        <div class="pic"></div>
        <div class="description">
          <h3>50+</h3>
          <p>{{ 'START-PAGE.SUCCESS' | translate }}</p></div>
      </div>
      <div class="iconBox">
        <div class="pic"></div>
        <div class="description"><h3>100%</h3>
          <p>{{ 'START-PAGE.RESULT' | translate }}</p></div>
      </div>
    </div>
  </div>
  <app-hero-parallax />
</main>
