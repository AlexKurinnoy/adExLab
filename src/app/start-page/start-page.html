<main>
  <div class="main-box">
    <h1 [innerHTML]="'START-PAGE.SLOGAN' | translate"></h1>
    <h2>
      Обєднуємо стратегію, дизайн, розробку та маркетинг, щоб Ваш бізнес зростав стабільно та прогнозовано.
    </h2>
    <div class="innerBox">
      <a href="#">
        <div class="actionButton">
          Обговорити проект →
        </div>
      </a>
      <div class="separ"></div>
      <div class="playBox">
        <a href="#">
          <img src="img/play_ico.png" alt="play">
          <p>Дивитись відео</p>
        </a>
      </div>
    </div>
    <div class="boxWithIcons">
      <div class="iconBox">
        <div class="pic"></div>
        <div class="description">
          <h3>10+</h3>
          <p>років досвіду</p>
        </div>
      </div>
      <div class="iconBox">
        <div class="pic"></div>
        <div class="description">
          <h3>50+</h3>
          <p>успішних проектів</p></div>
      </div>
      <div class="iconBox">
        <div class="pic"></div>
        <div class="description"><h3>100%</h3>
          <p>орієнтація на результат</p></div>
      </div>
    </div>
  </div>
</main>
