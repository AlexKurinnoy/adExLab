<div class="contact">

  <div class="form-card" ngSkipHydration>

    <h2> {{ 'CONTACT-PAGE.CONTACT_AS' | translate }}</h2>
    <p>{{ 'CONTACT-PAGE.CONTACT_AS_DESCR' | translate }}</p>
    <div class="line"></div>
    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="row">
        <input
          type="text"
          placeholder="Ім'я"
          formControlName="name">

        <input
          type="text"
          placeholder="Телефон"
          formControlName="phone">
      </div>
      <div class="row">
        <input
          type="email"
          placeholder="Email"
          formControlName="email">
      </div>
      <div class="row">
      <textarea
        rows="6"
        placeholder="Опишіть ваше питання..."
        formControlName="description"></textarea>
      </div>
      <button type="submit">
        <img src="img/send.svg" alt="email">
        <span class="nambbut">Надіслати повідомлення</span>
      </button>

    </form>

  </div>

  <div class="contact-methods">
    <div class="tel">
      +3880 880 50 22
    </div>

    <a href="skype:live:yourname?chat">
      <img src="img/skype.svg" alt="skype">
      Skype
    </a>

    <a href="https://t.me/username">
      <img src="img/telegram.svg" alt="telegram">
      Telegram
    </a>

    <a href="">
      <img src="img/linkedin.svg" alt="linkedin">
      LinkedIn
    </a>

    <a href="mailto:mail@example.com">
      <img src="img/email.svg" alt="email">
      Email
    </a>

  </div>

</div>
